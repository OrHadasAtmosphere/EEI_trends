[project]
name = "eeiprocesses"
version = "0.1.0"
description = "process-based analysis of EEI trends"
authors = [
  {name = "Clare Singer", email = "Clare.Singer@colorado.edu"},
  {name = "Or Hadas", email = "or.hadas@weizmann.ac.il"},
  {name = "Rowan Orlijan-Rhyne", email = "rowan.orlijan-rhyne@mpimet.mpg.de"},
]
readme="README.md"
requires-python=">=3.11"

dependencies = [
    "cf-xarray>=0.11.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.3",
    "requests>=2.33.1",
    "xarray>=2026.4.0",
    "pandas>=3.0.2",
    "dask>=2026.3.0",
    "cartopy>=0.25.0",
    "cdsapi>=0.7.7",
    "scipy>=1.17.1",
    "netcdf4>=1.7.4",
    "xesmf>=0.9.2",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eeiprocesses"]